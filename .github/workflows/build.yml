name: Build with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GHIDRA_VERSION: "12.0"
      GHIDRA_DATE: "20251205"

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Download Ghidra
      run: |
        mkdir -p "$RUNNER_TEMP/ghidra"

        wget --no-verbose -O "$RUNNER_TEMP/ghidra/ghidra.zip" \
          https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${{ env.GHIDRA_VERSION }}_build/ghidra_${{ env.GHIDRA_VERSION }}_PUBLIC_${{ env.GHIDRA_DATE }}.zip

        7z x -bd "$RUNNER_TEMP/ghidra/ghidra.zip" -o"$RUNNER_TEMP/ghidra"

    - name: Set GHIDRA_INSTALL_DIR
      run: echo "GHIDRA_INSTALL_DIR=$RUNNER_TEMP/ghidra/ghidra_${{ env.GHIDRA_VERSION }}_PUBLIC" >> $GITHUB_ENV

    - name: Build with Gradle
      run: |
        echo "Using GHIDRA_INSTALL_DIR=$GHIDRA_INSTALL_DIR"
        gradle -PGHIDRA_INSTALL_DIR="$GHIDRA_INSTALL_DIR" clean build

    - name: Assemble release directory
      run: |
        mkdir -p release
        zipfile=$(find dist -type f -name '*.zip' | head -n1)
        if [ -z "$zipfile" ]; then
          echo "No zip artifact found"
          exit 1
        fi
        cp "$zipfile" release/
        cp bridge_mcp_ghidra.py release/

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: GhidraMCP-artifact
        path: release/*
